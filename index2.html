<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <title>BhaxaLab</title>
  <style>
    html, body { height: 100%; }

    body {
      margin: 0;

      background: #f7f7f7;
    }

    .main {
      padding: 2rem 3rem;
      border-radius: 16px;

      text-align: center;
    }

    h1 {
      margin: 0 0 .5rem;
      font-size: 2rem;

      margin-top: 1.5rem;
      display: flex;
      justify-content: center;

      flex-wrap: wrap;
